name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/zyvorai/zyvor-nuvora
    steps:
      - uses: actions/checkout@v4
      - name: Version matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"${version}\"" pyproject.toml || { echo "pyproject.toml version != ${version}"; exit 1; }
          grep -q "^appVersion: \"\?${version}\"\?" deploy/helm/Chart.yaml || { echo "Chart appVersion != ${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - name: Test
        run: |
          python -m pip install -q '.[pdf,sso]' build
          python scripts/check-spdx.py
          python -m unittest discover -s tests
          (cd web && npm ci && npm run build && npm test)
      - name: Wheel and sdist
        run: python -m build -o dist
      - uses: azure/setup-helm@v4
      - name: Helm chart
        run: helm package deploy/helm -d dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=LicenseRef-Zyvor-Production-1.0
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ env.VERSION }}
          format: spdx-json
          output-file: dist/zyvor-nuvora-${{ env.VERSION }}.spdx.json
          upload-artifact: false
      - name: Release notes from CHANGELOG
        run: |
          awk -v v="${VERSION}" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > dist/NOTES.md
          test -s dist/NOTES.md || echo "Release ${VERSION}" > dist/NOTES.md
      - name: GitHub release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "Nuvora ${VERSION}" --notes-file dist/NOTES.md \
            dist/*.whl dist/*.tar.gz dist/*.tgz dist/*.spdx.json
