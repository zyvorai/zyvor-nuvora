name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: python -m pip install -q '.[pdf,sso]'
      - run: python -m unittest discover -s tests -v
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: nuvora, POSTGRES_PASSWORD: nuvora, POSTGRES_DB: nuvora_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nuvora" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      NUVORA_TEST_DATABASE_URL: postgresql://nuvora:nuvora@localhost:5432/nuvora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q '.[all]'
      - run: python -m unittest discover -s tests -v
      - name: SQLite to PostgreSQL migration round trip
        run: |
          python - <<'EOF'
          from nuvora.store import Store
          from nuvora.security import Auth
          from nuvora.platform import Platform
          s = Store('/tmp/mig.db'); a = Auth(s); a.add_user('default', 'admin', 'Long-password-123', 'admin')
          Platform(s, a).seed({'tenant': 'default', 'username': 'admin', 'role': 'admin'})
          EOF
          PGPASSWORD=nuvora psql -h localhost -U nuvora -d nuvora_test -c 'CREATE DATABASE nuvora_mig'
          python scripts/migrate-sqlite-to-postgres.py /tmp/mig.db --url postgresql://nuvora:nuvora@localhost:5432/nuvora_mig
  bedrock-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q '.[aws]'
      - name: Bedrock tests (boto3/botocore)
        run: python -m unittest discover -s tests -p 'test_bedrock*.py' -v
      - name: Bedrock compatibility suite against a local Nuvora
        run: PYTHON=python scripts/bedrock/run-compat.sh
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-spdx.py
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci && npm run build && npm test
        working-directory: web
      - run: npm install --no-save --package-lock=false playwright && npx playwright install --with-deps chromium --only-shell
      - run: |
          NUVORA_ADMIN_PASSWORD=Nuvora-Test-Password-123 python -m nuvora.server --demo --db /tmp/nuvora-ci.db &
          python scripts/wait-ready.py
          node scripts/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: console-screenshots, path: docs/screenshots}
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm
      - run: helm template nuvora deploy/helm --set tls.existingSecret=nuvora-tls --set service.type=NodePort --set service.nodePort=30789 --set demo=true --set allowDemoPassword=true >/dev/null
      - run: helm template nuvora deploy/helm --set replicas=3 --set database.urlSecret=nuvora-db --set oidc.issuer=https://id.example/realms/z --set oidc.clientId=nuvora --set oidc.clientSecret=nuvora-oidc >/dev/null
      - name: Multi-replica SQLite is refused
        run: "! helm template nuvora deploy/helm --set replicas=2 >/dev/null 2>&1"
      - run: shellcheck -S warning scripts/deploy-remote.sh scripts/lib/deploy-guards.sh scripts/ci-deploy-guards.sh
      - run: ./scripts/ci-deploy-guards.sh
