[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zyvor-nuvora"
version = "0.2.0"
description = "Private AI platform: models, knowledge, agents and governed workflows"
requires-python = ">=3.11"
license = "LicenseRef-Zyvor-Production-1.0"
authors = [{name = "Zyvor AI Labs"}]
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]
pdf = ["pypdf>=5,<6"]
sso = ["cryptography>=43"]
postgres = ["psycopg[binary]>=3.2,<4"]
ocr = ["pytesseract>=0.3.10", "pillow>=10"]
all = ["zyvor-nuvora[aws,pdf,sso,postgres,ocr]"]

[project.scripts]
nuvora = "nuvora.server:main"
nuvoractl = "nuvora.cli:main"

[tool.setuptools.packages.find]
include = ["nuvora*"]

[tool.setuptools.package-data]
nuvora = ["static/*", "static/assets/*"]
