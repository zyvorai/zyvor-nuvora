{{- $postgres := .Values.database.urlSecret }}
{{- if and (gt (int .Values.replicas) 1) (not $postgres) }}
{{- fail "replicas > 1 needs PostgreSQL: set database.urlSecret (SQLite is single-writer)" }}
{{- end }}
{{- if and (gt (int .Values.replicas) 1) .Values.oidc.issuer (not .Values.oidc.clientSecret) }}
{{- fail "replicas > 1 with SSO needs oidc.clientSecret so every replica can verify login state" }}
{{- end }}
{{- if not $postgres }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.storage.className }}
  storageClassName: {{ .Values.storage.className | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/name: nuvora
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  replicas: {{ int .Values.replicas }}
  {{- if $postgres }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  {{- else }}
  strategy: {type: Recreate}
  {{- end }}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        app.kubernetes.io/name: nuvora
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: nuvora
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if or .Values.demo .Values.tls.existingSecret }}
        args:
        {{- if .Values.demo }}
        - --demo
        {{- end }}
        {{- if .Values.tls.existingSecret }}
        - --tls-cert=/tls/tls.crt
        - --tls-key=/tls/tls.key
        {{- end }}
        {{- end }}
        ports: [{name: http, containerPort: 8789}]
        env:
        - name: NUVORA_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef: {name: {{ .Values.adminSecret }}, key: password}
        {{- if not .Values.tls.existingSecret }}
        - {name: NUVORA_BEHIND_TLS_PROXY, value: "1"}
        {{- end }}
        {{- if .Values.allowDemoPassword }}
        - {name: NUVORA_ALLOW_DEMO_PASSWORD, value: "1"}
        {{- end }}
        {{- if $postgres }}
        - name: NUVORA_DATABASE_URL
          valueFrom:
            secretKeyRef: {name: {{ $postgres | quote }}, key: url}
        {{- end }}
        - name: NUVORA_PROVIDER_HOSTS
          value: {{ .Values.providerHosts | quote }}
        {{- with .Values.oidc }}
        {{- if .issuer }}
        - {name: NUVORA_OIDC_ISSUER, value: {{ .issuer | quote }}}
        - {name: NUVORA_OIDC_CLIENT_ID, value: {{ .clientId | quote }}}
        {{- if .clientSecret }}
        - name: NUVORA_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef: {name: {{ .clientSecret | quote }}, key: client-secret}
        {{- end }}
        {{- range $key, $env := dict "redirectUrl" "NUVORA_OIDC_REDIRECT_URL" "scopes" "NUVORA_OIDC_SCOPES" "rolesClaim" "NUVORA_OIDC_ROLES_CLAIM" "roleMap" "NUVORA_OIDC_ROLE_MAP" "defaultRole" "NUVORA_OIDC_DEFAULT_ROLE" "tenantClaim" "NUVORA_OIDC_TENANT_CLAIM" "identityClaim" "NUVORA_OIDC_IDENTITY_CLAIM" "audience" "NUVORA_OIDC_AUDIENCE" "label" "NUVORA_OIDC_LABEL" }}
        {{- with index $.Values.oidc $key }}
        - {name: {{ $env }}, value: {{ . | quote }}}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
        resources: {{ toYaml .Values.resources | nindent 10 }}
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        readinessProbe:
          httpGet: {path: /healthz, port: http, scheme: {{ if .Values.tls.existingSecret }}HTTPS{{ else }}HTTP{{ end }}}
        livenessProbe:
          httpGet: {path: /healthz, port: http, scheme: {{ if .Values.tls.existingSecret }}HTTPS{{ else }}HTTP{{ end }}}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: tmp, mountPath: /tmp}
        {{- if .Values.tls.existingSecret }}
        - {name: tls, mountPath: /tls, readOnly: true}
        {{- end }}
      volumes:
      - name: data
        {{- if $postgres }}
        emptyDir: {}
        {{- else }}
        persistentVolumeClaim: {claimName: {{ .Release.Name }}-data}
        {{- end }}
      - name: tmp
        emptyDir: {}
      {{- if .Values.tls.existingSecret }}
      - name: tls
        secret: {secretName: {{ .Values.tls.existingSecret }}, defaultMode: 0440}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: nuvora
spec:
  type: {{ .Values.service.type }}
  selector: {app: {{ .Release.Name }}}
  ports:
  - name: {{ if .Values.tls.existingSecret }}https{{ else }}http{{ end }}
    port: {{ .Values.service.port }}
    targetPort: http
    {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
    nodePort: {{ .Values.service.nodePort }}
    {{- end }}
